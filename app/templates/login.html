{% extends "base.html" %}
{% block title %}SIAS Hub – Log in{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:480px">
  <h1>Log in to SIAS Hub</h1>
  <p class="text-secondary">Use the account provided by your administrator.</p>
  <form id="login-form">
    <label for="username" class="form-label">Username</label><input id="username" name="username" class="form-control mb-3" autocomplete="username" required maxlength="200">
    <label for="password" class="form-label">Password</label><input id="password" name="password" class="form-control mb-3" type="password" autocomplete="current-password" required maxlength="256">
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p id="login-message" class="mt-3" role="status"></p>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/login.js') }}"></script>{% endblock %}
