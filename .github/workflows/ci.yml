name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v

      - name: Provision validation administrator
        shell: bash
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import os, secrets
          from app.auth import create_user
          from app.models.assets import AssetRegistry
          password = secrets.token_urlsafe(32)
          create_user(AssetRegistry('instance/sias.sqlite3'), dict(username='ci-admin', name='CI Admin', password=password, role='admin'))
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('SIAS_ADMIN_USERNAME=ci-admin\nSIAS_ADMIN_PASSWORD=' + password + '\n')
          PY

      - name: Run deterministic demo validation
        shell: bash
        run: |
          python app.py > server.log 2>&1 &
          server_pid=$!
          trap "kill $server_pid 2>/dev/null || true" EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5000/health; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:5000/health
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/demo_validation.ps1 -BaseUrl http://127.0.0.1:5000 -ReportPath artifacts/demo-validation.json

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sias-validation-evidence
          path: |
            artifacts/demo-validation.json
            server.log
